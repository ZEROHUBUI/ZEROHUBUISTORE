<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Идоракунии Барнома | ZEROHUB Admin</title>
    <link rel="stylesheet" href="admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-container">
        
        <header class="admin-header glass-card" style="display:flex; justify-style:space-between; align-items:center;">
            <button class="danger-btn" onclick="window.location.href='admin.html'">
                <i class="fa-solid fa-arrow-left"></i> Ба ақиб
            </button>
            <h1 class="aurora-text" id="app-header-title">Идоракунии барнома</h1>
            <button id="delete-app-btn" class="danger-btn"><i class="fa-solid fa-trash"></i> Нест кардан</button>
        </header>

        <!-- БАХШИ ОМОРИ РЕАЛӢ (ANALYTICS) -->
        <section class="glass-card" style="margin-bottom: 20px;">
            <h2><i class="fa-solid fa-chart-line"></i> Омори аниқ (Analytics)</h2>
            <div style="display: flex; gap: 20px; margin-top: 15px;">
                <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; text-align: center;">
                    <i class="fa-solid fa-eye" style="font-size: 24px; color: #3b82f6;"></i>
                    <h3 id="stat-views" style="font-size: 28px; margin: 10px 0 0 0; color: #fff;">0</h3>
                    <p style="margin: 0; color: #94a3b8; font-size: 13px;">Боришоти саҳифа (Просмотр)</p>
                </div>
                <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; text-align: center;">
                    <i class="fa-solid fa-download" style="font-size: 24px; color: #10b981;"></i>
                    <h3 id="stat-downloads" style="font-size: 28px; margin: 10px 0 0 0; color: #fff;">0</h3>
                    <p style="margin: 0; color: #94a3b8; font-size: 13px;">Зеркашиҳо (Скачивания)</p>
                </div>
            </div>
        </section>

        <!-- ФОРМАИ ТАҲРИР ВА ИЛОВАИ ВЕРСИЯИ НАВ -->
        <section class="glass-card">
            <h2><i class="fa-solid fa-pen-to-square"></i> Таҳрир / Иловаи Версияи Нав</h2>
            
            <form id="edit-app-form">
                <div class="input-group">
                    <label><i class="fa-solid fa-layer-group"></i> Бахш:</label>
                    <select id="edit-category" required>
                        <option value="apps">Программы (Барномаҳо)</option>
                        <option value="games">Игры (Бозиҳо)</option>
                        <option value="moding">MODING (Худсохт)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-heading"></i> Номи барнома:</label>
                    <input type="text" id="edit-title" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-user-gear"></i> Таҳиягар:</label>
                    <input type="text" id="edit-developer" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-image"></i> Ссилкаи Иконка (URL):</label>
                    <input type="url" id="edit-icon-url" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-code-branch"></i> Версияи нав / ҷорӣ:</label>
                    <input type="text" id="edit-version" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-paper-plane"></i> Ссилкаи мустақим (Telegram File):</label>
                    <input type="url" id="edit-download-url" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-play"></i> Embed Трейлер:</label>
                    <textarea id="edit-embed-video"></textarea>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-images"></i> Скриншотҳо:</label>
                    <input type="url" id="edit-shot-1" placeholder="Скриншоти 1" style="margin-bottom: 6px;">
                    <input type="url" id="edit-shot-2" placeholder="Скриншоти 2" style="margin-bottom: 6px;">
                    <input type="url" id="edit-shot-3" placeholder="Скриншоти 3" style="margin-bottom: 6px;">
                    <input type="url" id="edit-shot-4" placeholder="Скриншоти 4">
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-file-lines"></i> Тавсиф:</label>
                    <textarea id="edit-description" rows="5" required></textarea>
                </div>

                <button type="submit" class="glow-btn">
                    <i class="fa-solid fa-floppy-disk"></i> Сабти тағйирот ва навсозӣ
                </button>
            </form>
        </section>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
